<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    
    <h1 class="text-center">Pricing</h1>
    <p class="text-center">please checout our most effective payment models</p>
    <div class="row text-center justify-content-evenly">
        <div class="card col-sm-5 col-md-3 me-3">
            <div class="card-header">
                <h4>Free</h4>
            </div>
            <div class="card-body">
                <h1 class="card-tittle">$0 / mo</h1>
                <ul class="list-unstyled">
                    <li>10 users included</li>
                    <li>2 GB of storage</li>
                    <li>Email support</li>
                </ul>
                <button type="button" class="btn btn-primary">Sign up for free</button>
            </div>
        </div>
        <div class="card col-sm-5 col-md-3 me-3">
            <div class="card-header">
                <h4>Pro</h4>
            </div>
            <div class="card-body">
                <h1 class="card-tittle">$15 / mo</h1>
                <ul class="list-unstyled">
                    <li>20 users included</li>
                    <li>10 GB of storage</li>
                    <li>Email support</li>
                </ul>
                <button type="button" class="btn btn-primary">get started</button>
            </div>
        </div>
        <div class="card col-sm-5 col-md-3 me-3">
            <div class="card-header">
                <h4>Enterprise</h4>
            </div>
            <div class="card-body">
                <h1 class="card-tittle">$30 / mo</h1>
                <ul class="list-unstyled">
                    <li>30 users included</li>
                    <li>20 GB of storage</li>
                    <li>Email support</li>
                </ul>
                <button type="button" class="btn btn-primary">contact us</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
