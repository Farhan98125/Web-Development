<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get and Post</title>
</head>
<body>
    <h3>get request</h3>
    <form action="http://localhost:3000/get" method="GET">
        <input placeholder="Enter your name" name="name" type="text">
        <input placeholder="Enter your password" name="password" type="password">
        <button type="submit">Send GET Request</button>
    </form>

    <hr>
    <h3>Post request</h3>
    <form action="http://localhost:3000/post" method="POST">
        <input placeholder="Enter your name" name="name" type="text">
        <input placeholder="Enter your password" name="password" type="password"> 
        <button type="submit">Send GET Request</button>
    </form>
</body>
</html>
